name: Validate portfolio UI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Generate source-preserving HD preview only in review branch
        if: github.head_ref == 'photo/hd-preview-only'
        run: |
          python -m pip install "Pillow==11.3.0"
          python scripts/enhance_profile_preview.py
      - name: Commit the generated photo only to review branch
        if: github.head_ref == 'photo/hd-preview-only'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/preview/mww-profile-hd-1800.jpg
          if ! git diff --cached --quiet; then
            git commit -m "chore(photo): attach HD candidate [skip ci]"
            git push origin HEAD:photo/hd-preview-only
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check flat-color design constraint
        run: |
          if grep -Eni '(linear|radial|conic)-gradient[[:space:]]*\(' src/*.css; then
            echo 'Gradient styles are not allowed in this theme.'
            exit 1
          fi
          echo 'No gradient styles detected.'
      - name: Check core output
        run: |
          test -s dist/index.html
          test -f dist/assets/Marcello-Wijaya-CV.pdf
