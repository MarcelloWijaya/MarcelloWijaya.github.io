name: Build HD profile photo preview (branch only)
on:
  push:
    branches:
      - photo/hd-preview-only
    paths:
      - .github/workflows/hd-photo-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-hd-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview dependency
        run: python -m pip install "Pillow==11.3.0"
      - name: Build photo preview without replacing website asset
        run: python scripts/enhance_profile_preview.py
      - name: Attach preview for download
        uses: actions/upload-artifact@v4
        with:
          name: mww-hd-preview-1800
          path: preview/mww-profile-hd-1800.jpg
          retention-days: 7
      - name: Save preview file only to unmerged branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/mww-profile-hd-1800.jpg
          git diff --cached --quiet || (git commit -m "chore(photo): add HD candidate for approval" && git push)
